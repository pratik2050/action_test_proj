name: Artifacts

on:
    push:
        branches: dev

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v3

            - name: Install Latest NodeJS
              uses: actions/setup-node@v3
              with:
                node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Run Tests
              run: npm test

    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v3

            - name: Install Latest NodeJS
              uses: actions/setup-node@v3
              with:
                node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Build Website
              run: npm run build

            - name: make artifacts
              uses: actions/upload-artifact@v4
              with: 
                name: dist-files
                path: |
                    dist
                    package.json

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: deploy project
              run: echo "deploying...."